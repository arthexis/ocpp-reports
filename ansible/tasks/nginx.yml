---
- name: Install HTTPS exposure dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - acl
      - apache2-utils
    state: present
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

# Public ingress ownership is opt-in, independent of role and DNS resolution.
# A shared hostname resolving to another host is not deployment authority.
- name: Require explicit public HTTPS ownership on supported roles
  ansible.builtin.assert:
    that:
      - reports_role in ['watchtower', 'control']
    fail_msg: "Public Reports ingress is supported only on watchtower/control roles."
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Validate independent HTTPS hostnames
  ansible.builtin.assert:
    that:
      - reports_dashboard_hostname is match('^[A-Za-z0-9.-]+$')
      - reports_collector_hostname is match('^[A-Za-z0-9.-]+$')
      - reports_dashboard_hostname != reports_collector_hostname
      - reports_diagnostics_hostname not in [reports_dashboard_hostname, reports_collector_hostname]
      - reports_dashboard_hostname != 'porsche-abb.gelectriic.com'
      - reports_collector_hostname != 'porsche-abb.gelectriic.com'
      - reports_role in ['watchtower', 'control']
    fail_msg: "Dashboard and Collector need distinct hostnames; do not reuse the CSMS hostname."
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

# Bootstrap the diagnostics certificate using a temporary HTTP-only ACME site.
# Existing CSMS nginx configuration and certificates remain unchanged.
- name: Ensure persistent diagnostic HTTP-01 challenge webroot
  ansible.builtin.file:
    path: /var/www/ocpp-reports-diagnostics-acme
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Check if the diagnostics certificate already exists
  ansible.builtin.stat:
    path: "{{ reports_diagnostics_certificate }}"
  register: reports_diagnostics_cert_existing
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Provision diagnostic TLS certificate with Certbot webroot
  when:
    - (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)
    - reports_diagnostics_nginx_enabled | bool
    - not (reports_diagnostics_cert_existing.stat.exists | default(false))
  block:
    - name: Require default Let's Encrypt certificate paths for automatic issuance
      ansible.builtin.assert:
        that:
          - reports_diagnostics_certificate == '/etc/letsencrypt/live/' ~ reports_diagnostics_hostname ~ '/fullchain.pem'
          - reports_diagnostics_private_key == '/etc/letsencrypt/live/' ~ reports_diagnostics_hostname ~ '/privkey.pem'
        fail_msg: "Custom diagnostics TLS paths must be provisioned manually."

    - name: Install Certbot for diagnostic TLS
      ansible.builtin.apt:
        name: certbot
        state: present
      become: true

    - name: Create HTTP-01 challenge webroot
      ansible.builtin.file:
        path: /var/www/ocpp-reports-diagnostics-acme
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Install temporary diagnostics HTTP-01 challenge site
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/ocpp-reports-diagnostics-acme
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name {{ reports_diagnostics_hostname }};
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/ocpp-reports-diagnostics-acme;
              }
              location / { return 404; }
          }
      become: true

    - name: Enable diagnostics HTTP-01 challenge site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/ocpp-reports-diagnostics-acme
        dest: /etc/nginx/sites-enabled/ocpp-reports-diagnostics-acme
        state: link
      become: true

    - name: Validate HTTP-01 challenge configuration
      ansible.builtin.command: nginx -t
      become: true
      changed_when: false

    - name: Activate HTTP-01 challenge route
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true

    - name: Issue diagnostic hostname certificate
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - /var/www/ocpp-reports-diagnostics-acme
          - -d
          - "{{ reports_diagnostics_hostname }}"
          - --non-interactive
          - --agree-tos
          - --register-unsafely-without-email
          - --keep-until-expiring
      become: true
      no_log: true
  always:
    - name: Remove temporary HTTP-01 challenge link
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/ocpp-reports-diagnostics-acme
        state: absent
      become: true
    - name: Remove temporary HTTP-01 site
      ansible.builtin.file:
        path: /etc/nginx/sites-available/ocpp-reports-diagnostics-acme
        state: absent
      become: true
    - name: Validate configuration after removing challenge site
      ansible.builtin.command: nginx -t
      become: true
      changed_when: false
    - name: Reload nginx after removing challenge site
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true

- name: Inspect independent TLS and authentication prerequisites
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ ([reports_dashboard_certificate, reports_dashboard_private_key, reports_collector_certificate, reports_collector_private_key, reports_nginx_htpasswd, '/etc/ocpp-reports/collector.toml'] if reports_nginx_enabled | bool else []) + ([reports_diagnostics_certificate, reports_diagnostics_private_key] if reports_diagnostics_nginx_enabled | bool else []) }}"
  become: true
  register: reports_nginx_prerequisites
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Refuse incomplete HTTPS configuration
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
    fail_msg: >-
      Missing or invalid HTTPS prerequisite: {{ item.item }}.
      Certificates must cover the configured hostname; authentication files
      must be explicitly provisioned (no generated placeholder credentials).
  loop: "{{ reports_nginx_prerequisites.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Verify Collector service is running before public exposure
  ansible.builtin.command: systemctl is-active ocpp-reports-collector.service
  changed_when: false
  become: true
  when: reports_nginx_enabled | bool

- name: Verify Dashboard service is running before public exposure
  ansible.builtin.command: systemctl is-active ocpp-reports-dashboard.service
  changed_when: false
  become: true
  when: reports_nginx_enabled | bool

- name: Install shared Nginx package without changing CSMS site
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Check for legacy combined Reports site
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/ocpp-reports
  register: reports_legacy_site
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Refuse ambiguous legacy combined Reports exposure
  ansible.builtin.assert:
    that:
      - not reports_legacy_site.stat.exists
    fail_msg: "Disable the legacy /etc/nginx/sites-enabled/ocpp-reports site manually before enabling split hosts; CSMS is unaffected."
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Create Reports diagnostic archive and publication directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/ocpp-reports/diagnostics, owner: ocpp-reports, group: ocpp, mode: '2770'}
    - {path: /var/lib/ocpp-reports/diagnostics-public, owner: root, group: www-data, mode: '0750'}
    - {path: /etc/nginx/ocpp-reports-diagnostics, owner: root, group: root, mode: '0755'}
    - {path: /etc/ocpp-reports/diagnostics-auth, owner: root, group: www-data, mode: '0750'}
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

# /etc/ocpp-reports is root:ocpp 2770. Nginx is not in group ocpp;
# grant traversal to its worker without revealing Reports config or tokens.
- name: Install ACL utilities for private nginx credential traversal
  ansible.builtin.apt:
    name: acl
    state: present
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Allow nginx to traverse the private Reports configuration parent
  ansible.builtin.command:
    argv: [setfacl, -m, "u:www-data:--x", /etc/ocpp-reports]
  become: true
  changed_when: false
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Allow nginx to traverse the private Reports state parent
  ansible.builtin.command:
    argv: [setfacl, -m, "u:www-data:--x", /var/lib/ocpp-reports]
  become: true
  changed_when: false
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Verify nginx can read the published authentication file path
  ansible.builtin.command:
    argv: [namei, -l, /etc/ocpp-reports/diagnostics-auth]
  changed_when: false
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Inspect CSMS-owned legacy diagnostics virtual host
  ansible.builtin.stat:
    path: "/etc/nginx/sites-available/{{ reports_diagnostics_hostname }}"
  register: reports_old_diagnostics_host
  become: true
  when: reports_diagnostics_nginx_enabled | bool

- name: Read legacy diagnostics virtual host before ownership transfer
  ansible.builtin.slurp:
    src: "/etc/nginx/sites-available/{{ reports_diagnostics_hostname }}"
  register: reports_old_diagnostics_contents
  become: true
  when:
    - reports_diagnostics_nginx_enabled | bool
    - reports_old_diagnostics_host.stat.isreg | default(false)

- name: Refuse replacing an unrelated diagnostics hostname configuration
  ansible.builtin.assert:
    that:
      - "(reports_old_diagnostics_contents.content | b64decode).startswith('# Dedicated authenticated download host.')"
    fail_msg: "Existing diagnostics nginx host is not the known CSMS site; resolve ownership manually."
  when:
    - reports_diagnostics_nginx_enabled | bool
    - reports_old_diagnostics_host.stat.exists | default(false)

- name: Disable known CSMS-owned diagnostics site during Reports takeover
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ reports_diagnostics_hostname }}"
    state: absent
  become: true
  when:
    - reports_diagnostics_nginx_enabled | bool
    - reports_old_diagnostics_host.stat.exists | default(false)

- name: Remove known CSMS-owned diagnostics site after disabling it
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ reports_diagnostics_hostname }}"
    state: absent
  become: true
  when:
    - reports_diagnostics_nginx_enabled | bool
    - reports_old_diagnostics_host.stat.exists | default(false)

- name: Render independent Reports virtual hosts
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/ocpp-reports-{{ item }}.nginx.j2"
    dest: "/etc/nginx/sites-available/ocpp-reports-{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ (['dashboard', 'collector'] if reports_nginx_enabled | bool else []) + (['diagnostics'] if reports_diagnostics_nginx_enabled | bool else []) }}"
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Enable independent Reports virtual hosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/ocpp-reports-{{ item }}"
    dest: "/etc/nginx/sites-enabled/ocpp-reports-{{ item }}"
    state: link
  loop: "{{ (['dashboard', 'collector'] if reports_nginx_enabled | bool else []) + (['diagnostics'] if reports_diagnostics_nginx_enabled | bool else []) }}"
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Validate complete Nginx configuration
  ansible.builtin.command: nginx -t
  become: true
  changed_when: false
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)

- name: Reload shared Nginx only after successful validation
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: reloaded
  become: true
  when: (reports_nginx_enabled | bool) or (reports_diagnostics_nginx_enabled | bool)
