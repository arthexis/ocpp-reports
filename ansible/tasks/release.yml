- name: Inspect immutable Reports release
  ansible.builtin.stat:
    path: "{{ reports_release }}"
    follow: false
  register: reports_existing_release
- name: Validate existing release interpreter before probing the application
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/python_preflight.py"
      - --check-venv
      - "{{ reports_release }}/venv"
  changed_when: false
  when: reports_existing_release.stat.exists | default(false)
- name: Verify installed Reports distribution and CLI
  ansible.builtin.command:
    argv:
      - "{{ reports_release }}/venv/bin/python"
      - -c
      - |
        from importlib.metadata import distribution
        from pathlib import Path
        import ocpp_reports
        root = Path("{{ reports_release }}/venv").resolve()
        assert distribution("ocpp-reports").version
        assert Path(ocpp_reports.__file__).resolve().is_relative_to(root)
        assert Path("{{ reports_release }}/venv/bin/ocpp-reports").is_file()
  register: reports_release_probe
  changed_when: false
  failed_when: false
  when: reports_existing_release.stat.exists | default(false)
- name: Verify existing Reports CLI
  ansible.builtin.command:
    argv:
      - "{{ reports_release }}/venv/bin/ocpp-reports"
      - --help
  register: reports_cli_probe
  changed_when: false
  failed_when: false
  when:
    - reports_existing_release.stat.exists | default(false)
    - reports_release_probe.rc | default(1) == 0
- name: Reject incomplete immutable Reports release
  ansible.builtin.assert:
    that:
      - reports_existing_release.stat.isdir | default(false)
      - reports_release_probe.rc | default(1) == 0
      - reports_cli_probe.rc | default(1) == 0
    fail_msg: "Existing Reports release is incomplete; refusing to modify it in place."
  when: reports_existing_release.stat.exists | default(false)
- name: Create Reports release directory
  ansible.builtin.file:
    path: "{{ reports_release }}"
    state: directory
    mode: '0755'
  become: true
  when: not reports_existing_release.stat.exists
- name: Create isolated release virtual environment
  ansible.builtin.command:
    cmd: "{{ reports_python }} -m venv {{ reports_release }}/venv"
  become: true
  when: not reports_existing_release.stat.exists
- name: Verify newly created release interpreter
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/python_preflight.py"
      - --check-venv
      - "{{ reports_release }}/venv"
      - --minor
      - "{{ reports_python_minor }}"
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Verify pinned Reports checkout has no local package edits
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ playbook_dir }}/.."
      - status
      - --porcelain
      - --untracked-files=all
      - --
      - pyproject.toml
      - README.md
      - src
  register: reports_checkout_package_status
  changed_when: false
  failed_when: reports_checkout_package_status.rc != 0 or (reports_checkout_package_status.stdout | trim | length > 0)
  when: not reports_existing_release.stat.exists
- name: Verify pinned Reports checkout revision
  ansible.builtin.command:
    argv: [git, -C, "{{ playbook_dir }}/..", rev-parse, HEAD]
  register: reports_build_checkout_revision
  changed_when: false
  failed_when: reports_build_checkout_revision.rc != 0 or (reports_build_checkout_revision.stdout | trim) != reports_commit
  when: not reports_existing_release.stat.exists
- name: Resolve effective runtime dependency set
  ansible.builtin.command:
    argv:
      - "{{ reports_python }}"
      - "{{ playbook_dir }}/dependency_plan.py"
      - "{{ playbook_dir }}/../pyproject.toml"
      - "{{ reports_install_extra }}"
  register: reports_dependency_plan
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Capture reusable dependency environment
  ansible.builtin.set_fact:
    reports_dependency_venv: >-
      {{ reports_root }}/dependencies/{{ (reports_dependency_plan.stdout | from_json).key }}-py{{ reports_python_minor | replace('.', '') }}/venv
    reports_dependency_requirements: "{{ (reports_dependency_plan.stdout | from_json).requirements }}"
  when: not reports_existing_release.stat.exists
- name: Create reusable dependency environment
  ansible.builtin.command:
    cmd: "{{ reports_python }} -m venv {{ reports_dependency_venv }}"
    creates: "{{ reports_dependency_venv }}/bin/python"
  become: true
  when: not reports_existing_release.stat.exists
- name: Verify reusable dependency interpreter matches the release
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/python_preflight.py"
      - --check-venv
      - "{{ reports_dependency_venv }}"
      - --minor
      - "{{ reports_python_minor }}"
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Converge reusable runtime dependencies
  ansible.builtin.pip:
    name: "{{ reports_dependency_requirements }}"
    virtualenv: "{{ reports_dependency_venv }}"
    extra_args: "--only-binary=:all:"
  become: true
  when: not reports_existing_release.stat.exists
- name: Verify reusable dependency distributions
  ansible.builtin.command:
    argv:
      - "{{ reports_dependency_venv }}/bin/python"
      - "{{ playbook_dir }}/dependency_plan.py"
      - --verify
      - "{{ playbook_dir }}/../pyproject.toml"
      - "{{ reports_install_extra }}"
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Resolve reusable dependency site packages
  ansible.builtin.command:
    argv:
      - "{{ reports_dependency_venv }}/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: reports_dependency_site
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Resolve release site packages
  ansible.builtin.command:
    argv:
      - "{{ reports_release }}/venv/bin/python"
      - -c
      - "import sysconfig; print(sysconfig.get_paths()['purelib'])"
  register: reports_release_site
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Link reusable dependencies into release
  ansible.builtin.copy:
    dest: "{{ reports_release_site.stdout }}/ocpp_reports_dependencies.pth"
    content: "{{ reports_dependency_site.stdout }}\n"
    mode: '0644'
  become: true
  when: not reports_existing_release.stat.exists
- name: Create reusable wheel build environment
  ansible.builtin.command:
    cmd: "{{ reports_python }} -m venv {{ reports_root }}/build-venv-py{{ reports_python_minor | replace('.', '') }}"
    creates: "{{ reports_root }}/build-venv-py{{ reports_python_minor | replace('.', '') }}/bin/python"
  become: true
  when: not reports_existing_release.stat.exists
- name: Verify reusable build interpreter matches the release
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/python_preflight.py"
      - --check-venv
      - "{{ reports_root }}/build-venv-py{{ reports_python_minor | replace('.', '') }}"
      - --minor
      - "{{ reports_python_minor }}"
  changed_when: false
  when: not reports_existing_release.stat.exists
- name: Converge wheel build tools
  ansible.builtin.pip:
    name:
      - "setuptools>=68"
      - wheel
    virtualenv: "{{ reports_root }}/build-venv-py{{ reports_python_minor | replace('.', '') }}"
  become: true
  when: not reports_existing_release.stat.exists
# Building from a pinned local Git revision makes pip use a disposable clone.
# Build as the checkout operator to honor Git ownership checks; never allow
# root-owned build/egg-info files to appear in the working tree. Promote only
# the finished wheel into the protected immutable release.
- name: Create temporary operator-owned Reports wheel directory
  ansible.builtin.tempfile:
    state: directory
    prefix: ocpp-reports-wheel-
  become: true
  become_user: "{{ reports_operator }}"
  register: reports_wheel_temp
  when: not reports_existing_release.stat.exists

- name: Build and validate pinned Reports wheel
  when: not reports_existing_release.stat.exists
  block:
    - name: Build Reports application wheel
      ansible.builtin.command:
        argv:
          - "{{ reports_root }}/build-venv-py{{ reports_python_minor | replace('.', '') }}/bin/python"
          - -m
          - pip
          - wheel
          - --no-deps
          - --no-build-isolation
          - --wheel-dir
          - "{{ reports_wheel_temp.path }}"
          - "git+file://{{ playbook_dir }}/..@{{ reports_commit }}"
      become: true
      become_user: "{{ reports_operator }}"

    # The local pinned Git clone makes a deterministic source archive, without
    # staging each src/ file through Ansible or mutating the checkout.
    - name: Verify pinned Reports checkout remained unchanged during wheel build
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ playbook_dir }}/.."
          - status
          - --porcelain
          - --untracked-files=all
          - --
          - pyproject.toml
          - README.md
          - src
      register: reports_checkout_postbuild_status
      changed_when: false
      failed_when: reports_checkout_postbuild_status.rc != 0 or (reports_checkout_postbuild_status.stdout | trim | length > 0)

    - name: Verify pinned Reports revision after wheel build
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/..", rev-parse, HEAD]
      register: reports_postbuild_revision
      changed_when: false
      failed_when: reports_postbuild_revision.rc != 0 or (reports_postbuild_revision.stdout | trim) != reports_commit

    - name: Find built Reports wheel
      ansible.builtin.find:
        paths: "{{ reports_wheel_temp.path }}"
        patterns: "ocpp_reports-*.whl"
        file_type: file
      register: reports_wheels
      become: true
      become_user: "{{ reports_operator }}"

    - name: Require exactly one Reports wheel
      ansible.builtin.assert:
        that: reports_wheels.matched | int == 1

    - name: Promote single Reports wheel to immutable release
      ansible.builtin.copy:
        src: "{{ reports_wheels.files[0].path }}"
        dest: "{{ reports_release }}/{{ reports_wheels.files[0].path | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      become: true
  always:
    - name: Clean temporary Reports wheel directory
      ansible.builtin.file:
        path: "{{ reports_wheel_temp.path }}"
        state: absent
      become: true
      become_user: "{{ reports_operator }}"

- name: Install Reports wheel without dependency downloads
  ansible.builtin.pip:
    name: "{{ reports_release }}/{{ reports_wheels.files[0].path | basename }}"
    virtualenv: "{{ reports_release }}/venv"
    extra_args: "--no-index --no-deps"
  become: true
  when: not reports_existing_release.stat.exists
- name: Check installed CLI
  ansible.builtin.command:
    cmd: "{{ reports_release }}/venv/bin/ocpp-reports status --json"
  changed_when: false
