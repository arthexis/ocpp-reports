---
- name: Install selected Reports service unit
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/ocpp-reports-{{ reports_service }}.service.j2"
    dest: "/etc/systemd/system/ocpp-reports-{{ reports_service }}.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  register: reports_unit

- name: Check Forwarder environment
  ansible.builtin.stat:
    path: /etc/ocpp-reports/forwarder.toml
  become: true
  register: reports_forwarder_env
  when: reports_service == 'forwarder'

- name: Check Collector credentials
  ansible.builtin.stat:
    path: /etc/ocpp-reports/collector.toml
  become: true
  register: reports_collector_credentials
  when: reports_service == 'collector'

- name: Require regular Forwarder configuration before managing permissions
  ansible.builtin.assert:
    that:
      - reports_forwarder_env.stat.isreg | default(false)
    fail_msg: "Forwarder configuration must be a regular file."
  when: reports_service == 'forwarder' and (reports_forwarder_env.stat.exists | default(false))

- name: Normalize protected Forwarder configuration permissions
  ansible.builtin.file:
    path: /etc/ocpp-reports/forwarder.toml
    owner: root
    group: ocpp
    mode: '0640'
  become: true
  when: reports_service == 'forwarder' and (reports_forwarder_env.stat.exists | default(false))

- name: Reinspect normalized Forwarder configuration
  ansible.builtin.stat:
    path: /etc/ocpp-reports/forwarder.toml
  become: true
  register: reports_forwarder_env
  when: reports_service == 'forwarder' and (reports_forwarder_env.stat.exists | default(false))

- name: Validate configured Forwarder credentials
  ansible.builtin.assert:
    that:
      - reports_forwarder_env.stat.isreg | default(false)
      - reports_forwarder_env.stat.mode | default('') in ['0640', '0600']
    fail_msg: "Forwarder requires readable, protected forwarder.toml."
  when: reports_service == 'forwarder' and (reports_forwarder_env.stat.exists | default(false))

- name: Validate configured Collector credentials
  ansible.builtin.assert:
    that:
      - reports_collector_credentials.stat.isreg | default(false)
      - reports_collector_credentials.stat.mode | default('') in ['0640', '0600']
    fail_msg: "Collector credentials must be a protected regular file."
  when: reports_service == 'collector' and (reports_collector_credentials.stat.exists | default(false))

- name: Determine whether service is configured
  ansible.builtin.set_fact:
    reports_service_ready: "{{ (reports_service == 'dashboard') or (reports_service == 'forwarder' and (reports_forwarder_env.stat.exists | default(false))) or (reports_service == 'collector' and (reports_collector_credentials.stat.exists | default(false))) }}"

- name: Inspect existing Forwarder cursor database
  ansible.builtin.stat:
    path: /var/lib/ocpp-reports/forwarder.sqlite
  become: true
  register: reports_forwarder_state
  when: reports_service == 'forwarder'

- name: Refuse nonregular Forwarder cursor state
  ansible.builtin.assert:
    that:
      - reports_forwarder_state.stat.isreg | default(false)
    fail_msg: "Forwarder state must be a regular SQLite file."
  when: reports_service == 'forwarder' and (reports_forwarder_state.stat.exists | default(false))

- name: Restore Forwarder cursor file ownership without modifying contents
  ansible.builtin.file:
    path: /var/lib/ocpp-reports/forwarder.sqlite
    owner: ocpp-reports
    group: ocpp
    mode: '0660'
  become: true
  when: reports_service == 'forwarder' and (reports_forwarder_state.stat.exists | default(false))

- name: Inspect whether Forwarder was previously enabled
  ansible.builtin.command: systemctl is-enabled ocpp-reports-forwarder.service
  register: reports_forwarder_was_enabled
  changed_when: false
  failed_when: false
  when: reports_service == 'forwarder'

# A new satellite must be recognized by the *running* collector before
# first enable. Existing durable forwarders are intentionally exempt: a WAN
# outage must never prevent their normal restart/retry behavior.
- name: Check active collector before first Forwarder enable
  ansible.builtin.command:
    argv:
      - "{{ reports_release }}/venv/bin/ocpp-reports"
      - forwarder
      - check
      - --remote
      - --json
  become: true
  become_user: ocpp-reports
  register: reports_first_forwarder_readiness
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - reports_service == 'forwarder'
    - reports_service_ready | bool
    - not ((reports_forwarder_state.stat.exists | default(false)) and (reports_forwarder_was_enabled.rc | default(1) == 0))

- name: Block unrecognized new Forwarder before enabling service
  ansible.builtin.assert:
    that:
      - reports_first_forwarder_readiness.rc == 0
      - "(reports_first_forwarder_readiness.stdout | default('{}', true) | from_json).ready | default(false) | bool"
    fail_msg: >-
      The running collector has not authenticated this new source.
      Check 'ocpp-reports forwarder check --remote --json' as the ocpp-reports
      service user after updating collector config and its running service.
      The existing forwarder, if any, has not been stopped.
  when:
    - reports_service == 'forwarder'
    - reports_service_ready | bool
    - not ((reports_forwarder_state.stat.exists | default(false)) and (reports_forwarder_was_enabled.rc | default(1) == 0))

- name: Enable and start configured service
  ansible.builtin.systemd_service:
    name: "ocpp-reports-{{ reports_service }}.service"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (reports_unit.changed or reports_release_changed | bool) else 'started' }}"
  become: true
  when: reports_service_ready

- name: Disable unconfigured service to prevent crash loops
  ansible.builtin.systemd_service:
    name: "ocpp-reports-{{ reports_service }}.service"
    daemon_reload: true
    enabled: false
    state: stopped
  become: true
  when: not reports_service_ready

- name: Report missing service configuration
  ansible.builtin.debug:
    msg: "ocpp-reports-{{ reports_service }} installed but inactive; configure credentials and redeploy."
  when: not reports_service_ready
