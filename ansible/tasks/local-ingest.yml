---
- name: Discover active CSMS evidence directory
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/discover_csms_data_dir.py"
  become: true
  register: reports_discovered_csms_dir
  changed_when: false
  when: not reports_local_csms_data_dir | trim

- name: Resolve local CSMS evidence directory
  ansible.builtin.set_fact:
    reports_local_csms_data_dir: "{{ (reports_local_csms_data_dir | trim) or (reports_discovered_csms_dir.stdout | trim) }}"

- name: Validate local CSMS ingestion settings
  ansible.builtin.assert:
    that:
      - reports_local_csms_data_dir.startswith('/')
      - (reports_local_ingest_interval | float) > 0
    fail_msg: "Set an absolute OCPP_REPORTS_CSMS_DATA_DIR and positive OCPP_REPORTS_LOCAL_INGEST_INTERVAL."

- name: Inspect local CSMS evidence directory
  ansible.builtin.stat:
    path: "{{ reports_local_csms_data_dir }}"
  become: true
  register: reports_local_csms_evidence

- name: Refuse missing local CSMS evidence
  ansible.builtin.assert:
    that:
      - reports_local_csms_evidence.stat.isdir | default(false)
    fail_msg: "Local CSMS evidence directory is missing; do not start ingestion."

- name: Inspect active CSMS systemd service
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - ocpp-csms.service
  register: reports_local_csms_active
  changed_when: false
  failed_when: false

- name: Refuse ingestion without active CSMS
  ansible.builtin.assert:
    that:
      - reports_local_csms_active.rc == 0
    fail_msg: "ocpp-csms.service must be active before local ingestion is enabled."

- name: Ensure POSIX ACL tools are available
  ansible.builtin.package:
    name: acl
    state: present
  become: true

- name: Grant Reports read-only access to active CSMS evidence and producer
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/provision_csms_read_access.py"
      - ocpp-reports
      - "{{ reports_local_csms_data_dir }}"
  become: true
  changed_when: false

- name: Verify CSMS read-only export as Reports service account
  ansible.builtin.command:
    argv:
      - "{{ reports_release }}/venv/bin/python"
      - "{{ playbook_dir }}/../scripts/preflight_csms_export.py"
      - "{{ reports_local_csms_data_dir }}"
  become: true
  become_user: ocpp-reports
  register: reports_local_export_probe
  changed_when: false

- name: Install local ingestion systemd unit
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/ocpp-reports-ingest.service.j2"
    dest: /etc/systemd/system/ocpp-reports-ingest.service
    owner: root
    group: root
    mode: '0644'
  become: true
  register: reports_local_ingest_unit

- name: Enable and reconcile local ingestion service
  ansible.builtin.systemd_service:
    name: ocpp-reports-ingest.service
    daemon_reload: "{{ reports_local_ingest_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if (reports_local_ingest_unit.changed or reports_release_changed | bool) else 'started' }}"
  become: true
