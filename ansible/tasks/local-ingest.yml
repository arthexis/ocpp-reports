---
- name: Require explicit CSMS producer path and interval
  ansible.builtin.assert:
    that:
      - reports_local_csms_data_dir.startswith('/')
      - (reports_local_ingest_interval | float) > 0
    fail_msg: "Set absolute OCPP_REPORTS_CSMS_DATA_DIR and OCPP_REPORTS_CSMS_PYTHONPATH before enabling local ingestion."

- name: Check local CSMS paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ reports_local_csms_data_dir }}"
    - "{{ reports_local_csms_pythonpath }}/ocpp_csms/export_contract.py"
  register: reports_local_csms_paths

- name: Require readable local CSMS evidence and producer
  ansible.builtin.assert:
    that:
      - reports_local_csms_paths.results[0].stat.isdir | default(false)

- name: Install optional local ingestion unit
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/ocpp-reports-ingest.service.j2"
    dest: /etc/systemd/system/ocpp-reports-ingest.service
    mode: '0644'
  become: true

- name: Enable local ingestion
  ansible.builtin.systemd_service:
    name: ocpp-reports-ingest.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
