---
- name: Configure forwarder service
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/service.yml"
  vars:
    reports_service: "forwarder"
    reports_service_config: "/etc/ocpp-reports/forwarder.env"

- name: Create private diagnostics forwarding checkpoint directory
  ansible.builtin.file:
    path: /var/lib/ocpp-reports/diagnostic-forwarding
    state: directory
    owner: "{{ reports_operator }}"
    group: ocpp
    mode: '0700'
  become: true

- name: Install independent diagnostic forwarding service and timer
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/ocpp-reports-diagnostics-forward.{{ item }}.j2"
    dest: "/etc/systemd/system/ocpp-reports-diagnostics-forward.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [service, timer]
  become: true

- name: Enable periodic diagnostic forwarding with configured Collector credentials
  ansible.builtin.systemd_service:
    name: ocpp-reports-diagnostics-forward.timer
    daemon_reload: true
    enabled: "{{ reports_service_ready | bool }}"
    state: "{{ 'started' if reports_service_ready | bool else 'stopped' }}"
  become: true
