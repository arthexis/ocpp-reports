---
- name: Configure collector service
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/service.yml"
  vars:
    reports_service: "collector"
    reports_service_config: "/etc/ocpp-reports/collector-credentials.json"
- name: Configure dashboard service
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/service.yml"
  vars:
    reports_service: "dashboard"
    reports_service_config: ""
