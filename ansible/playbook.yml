---
- name: Install OCPP Reports
  hosts: localhost
  connection: local
  become: false
  vars:
    reports_local_ingest_enabled: "{{ lookup('env', 'OCPP_REPORTS_LOCAL_INGEST_ENABLED') | default('false', true) | bool }}"
    reports_local_csms_data_dir: "{{ lookup('env', 'OCPP_REPORTS_CSMS_DATA_DIR') | default('/var/lib/ocpp-csms/schemas/8', true) }}"
    reports_local_csms_pythonpath: "{{ lookup('env', 'OCPP_REPORTS_CSMS_PYTHONPATH') | default('', true) }}"
    reports_local_ingest_interval: "{{ lookup('env', 'OCPP_REPORTS_LOCAL_INGEST_INTERVAL') | default('30', true) }}"
    reports_nginx_enabled: "{{ lookup('env', 'OCPP_REPORTS_NGINX_ENABLED') | default('false', true) | bool }}"
    reports_dashboard_hostname: "{{ lookup('env', 'OCPP_REPORTS_DASHBOARD_HOSTNAME') | default('porsche.gelectriic.com', true) }}"
    reports_collector_hostname: "{{ lookup('env', 'OCPP_REPORTS_COLLECTOR_HOSTNAME') | default('collector.gelectriic.com', true) }}"
    reports_dashboard_certificate: "{{ lookup('env', 'OCPP_REPORTS_DASHBOARD_TLS_CERT') | default('/etc/letsencrypt/live/porsche.gelectriic.com/fullchain.pem', true) }}"
    reports_dashboard_private_key: "{{ lookup('env', 'OCPP_REPORTS_DASHBOARD_TLS_KEY') | default('/etc/letsencrypt/live/porsche.gelectriic.com/privkey.pem', true) }}"
    reports_collector_certificate: "{{ lookup('env', 'OCPP_REPORTS_COLLECTOR_TLS_CERT') | default('/etc/letsencrypt/live/collector.gelectriic.com/fullchain.pem', true) }}"
    reports_collector_private_key: "{{ lookup('env', 'OCPP_REPORTS_COLLECTOR_TLS_KEY') | default('/etc/letsencrypt/live/collector.gelectriic.com/privkey.pem', true) }}"
    reports_nginx_htpasswd: "{{ lookup('env', 'OCPP_REPORTS_HTPASSWD') | default('/etc/ocpp-reports/dashboard.htpasswd', true) }}"
    reports_operator: "{{ lookup('env', 'OCPP_REPORTS_OPERATOR') | default(lookup('pipe', 'stat -c %U ' ~ playbook_dir ~ '/..'), true) }}"
    reports_commit: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse HEAD') | trim }}"
    reports_root: "{{ lookup('env', 'OCPP_REPORTS_INSTALL_ROOT') | default('/opt/ocpp-reports', true) }}"
    reports_install_extra: "{{ '[forwarder]' if reports_role == 'satellite' else ('[web,forwarder]' if reports_role == 'control' else ('[web]' if reports_role == 'watchtower' else '')) }}"
    reports_release: "{{ reports_root }}/releases/{{ reports_commit }}"
    reports_cli_link: "{{ lookup('env', 'OCPP_REPORTS_CLI_LINK') | default('/usr/local/bin/ocpp-reports', true) }}"
  pre_tasks:
    - name: Validate selected installation role
      ansible.builtin.assert:
        that:
          - reports_role is defined
          - reports_role in ['terminal', 'satellite', 'watchtower', 'control']
    - name: Check persisted installation role
      ansible.builtin.stat:
        path: "{{ reports_root }}/role"
      register: reports_role_file
    - name: Read persisted role
      ansible.builtin.slurp:
        src: "{{ reports_root }}/role"
      register: reports_role_saved
      when: reports_role_file.stat.exists and reports_role_file.stat.isreg
    - name: Refuse changed or invalid role
      ansible.builtin.assert:
        that:
          - not reports_role_file.stat.exists or reports_role_file.stat.isreg
          - not reports_role_file.stat.exists or (reports_role_saved.content | b64decode | trim) == reports_role
    - name: Inspect existing Reports CLI
      ansible.builtin.stat:
        path: "{{ reports_cli_link }}"
        follow: false
      register: reports_previous_cli
    - name: Inspect previous installation without role marker
      ansible.builtin.stat:
        path: "{{ reports_root }}/releases"
      register: reports_previous_releases
    - name: Refuse adoption of an unmarked existing installation
      ansible.builtin.assert:
        that:
          - reports_role_file.stat.exists or (not reports_previous_releases.stat.exists and not reports_previous_cli.stat.exists) or (reports_previous_releases.stat.isdir | default(false) and not (reports_previous_releases.stat.islnk | default(false)) and (reports_previous_cli.stat.islnk | default(false) or not reports_previous_cli.stat.exists))
        fail_msg: "Unrecognized Reports installation without a role marker; refusing deployment."
  tasks:
    - name: Ensure shared OCPP operator group exists
      ansible.builtin.group:
        name: ocpp
        state: present
      become: true
    - name: Ensure Reports service identity exists
      ansible.builtin.user:
        name: ocpp-reports
        group: ocpp
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      become: true
    - name: Validate intended interactive Reports operator
      ansible.builtin.assert:
        that:
          - reports_operator not in ['root', '', 'UNKNOWN']
        fail_msg: "Set OCPP_REPORTS_OPERATOR to the intended CLI account."
    - name: Add intended operator to OCPP group
      ansible.builtin.user:
        name: "{{ reports_operator }}"
        groups: ocpp
        append: true
      become: true
    - name: Create shared OCPP configuration directory
      ansible.builtin.file:
        path: /etc/ocpp-reports
        state: directory
        owner: root
        group: ocpp
        mode: '2770'
      become: true
    - name: Install initial Reports TOML without overwriting operator edits
      ansible.builtin.copy:
        dest: /etc/ocpp-reports/config.toml
        content: |
          [mail]
          host = ""
          port = 587
          tls = "starttls"
          from = ""
          to = ""
        owner: root
        group: ocpp
        mode: '0660'
        force: false
      become: true
    - name: Create shared Reports state and attachment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ocpp-reports
        group: ocpp
        mode: '2770'
      loop:
        - /var/lib/ocpp-reports
        - /var/lib/ocpp-reports/attachments
      become: true
    - name: Validate deployment host
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] in ['aarch64', 'x86_64']
    - name: Create Reports release directory
      ansible.builtin.file:
        path: "{{ reports_release }}"
        state: directory
        mode: '0755'
      become: true
    - name: Create isolated virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ reports_release }}/venv"
        creates: "{{ reports_release }}/venv/bin/python"
      become: true
    - name: Create release-local package staging directory
      ansible.builtin.file:
        path: "{{ reports_release }}/source"
        state: directory
        mode: '0755'
      become: true

    - name: Stage pinned Reports package files in the owned release
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ reports_release }}/source/{{ item }}"
        mode: preserve
      loop:
        - pyproject.toml
        - README.md
        - src/
      become: true

    - name: Install Reports dependencies without source builds (once per release)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/install_release.py"
          - "{{ reports_release }}"
          - "{{ reports_install_extra }}"
        creates: "{{ reports_release }}/.installed"
      become: true
    - name: Check installed CLI
      ansible.builtin.command:
        cmd: "{{ reports_release }}/venv/bin/ocpp-reports status --json"
      changed_when: false
    - name: Link active Reports CLI
      ansible.builtin.file:
        src: "{{ reports_release }}/venv/bin/ocpp-reports"
        dest: "{{ reports_cli_link }}"
        state: link
        force: true
      become: true
    - name: Apply selected Reports role
      ansible.builtin.include_role:
        name: "{{ reports_role }}"
    - name: Persist immutable Reports role after successful installation
      ansible.builtin.copy:
        dest: "{{ reports_root }}/role"
        content: "{{ reports_role }}"
        owner: root
        group: root
        mode: '0644'
        force: false
      become: true
