---
- name: Install OCPP Reports
  hosts: localhost
  connection: local
  become: false
  vars:
    reports_local_ingest_enabled: "{{ lookup('env', 'OCPP_REPORTS_LOCAL_INGEST_ENABLED') | default('false', true) | bool }}"
    reports_local_diagnostics_source: "{{ lookup('env', 'OCPP_REPORTS_LOCAL_DIAGNOSTICS_SOURCE') | default(ansible_facts['hostname'], true) }}"
    reports_local_csms_data_dir: "{{ lookup('env', 'OCPP_REPORTS_CSMS_DATA_DIR') | default('/var/lib/ocpp-csms/schemas/8', true) }}"
    reports_local_csms_pythonpath: "{{ lookup('env', 'OCPP_REPORTS_CSMS_PYTHONPATH') | default('', true) }}"
    reports_local_ingest_interval: "{{ lookup('env', 'OCPP_REPORTS_LOCAL_INGEST_INTERVAL') | default('30', true) }}"
    reports_nginx_enabled: "{{ lookup('env', 'OCPP_REPORTS_NGINX_ENABLED') | default('false', true) | bool }}"
    reports_diagnostics_hostname: "{{ lookup('env', 'OCPP_REPORTS_DIAGNOSTICS_HOSTNAME') | default('diagnose.gelectriic.com', true) }}"
    reports_diagnostics_certificate: >-
      {{ lookup('env', 'OCPP_REPORTS_DIAGNOSTICS_TLS_CERT') | default('/etc/letsencrypt/live/diagnose.gelectriic.com/fullchain.pem', true) }}
    reports_diagnostics_private_key: >-
      {{ lookup('env', 'OCPP_REPORTS_DIAGNOSTICS_TLS_KEY') | default('/etc/letsencrypt/live/diagnose.gelectriic.com/privkey.pem', true) }}
    reports_dashboard_hostname: "{{ lookup('env', 'OCPP_REPORTS_DASHBOARD_HOSTNAME') | default('porsche.gelectriic.com', true) }}"
    reports_collector_hostname: "{{ lookup('env', 'OCPP_REPORTS_COLLECTOR_HOSTNAME') | default('collector.gelectriic.com', true) }}"
    reports_dashboard_certificate: >-
      {{ lookup('env', 'OCPP_REPORTS_DASHBOARD_TLS_CERT') | default('/etc/letsencrypt/live/porsche.gelectriic.com/fullchain.pem', true) }}
    reports_dashboard_private_key: >-
      {{ lookup('env', 'OCPP_REPORTS_DASHBOARD_TLS_KEY') | default('/etc/letsencrypt/live/porsche.gelectriic.com/privkey.pem', true) }}
    reports_collector_certificate: >-
      {{ lookup('env', 'OCPP_REPORTS_COLLECTOR_TLS_CERT') | default('/etc/letsencrypt/live/collector.gelectriic.com/fullchain.pem', true) }}
    reports_collector_private_key: >-
      {{ lookup('env', 'OCPP_REPORTS_COLLECTOR_TLS_KEY') | default('/etc/letsencrypt/live/collector.gelectriic.com/privkey.pem', true) }}
    reports_nginx_htpasswd: "{{ lookup('env', 'OCPP_REPORTS_HTPASSWD') | default('/etc/ocpp-reports/dashboard.htpasswd', true) }}"
    reports_operator: "{{ lookup('env', 'OCPP_REPORTS_OPERATOR') | default(lookup('pipe', 'stat -c %U ' ~ playbook_dir ~ '/..'), true) }}"
    reports_commit: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse HEAD') | trim }}"
    reports_root: "{{ lookup('env', 'OCPP_REPORTS_INSTALL_ROOT') | default('/opt/ocpp-reports', true) }}"
    reports_install_extra: >-
      {{ '[forwarder]' if reports_role == 'satellite' else ('[web,forwarder]' if reports_role == 'control' else ('[web]' if reports_role == 'watchtower' else '')) }}
    reports_release: "{{ reports_root }}/releases/{{ reports_commit }}-pkg"
    reports_current: "{{ reports_root }}/current"
    reports_previous: "{{ reports_root }}/previous"
    reports_cli_link: "{{ lookup('env', 'OCPP_REPORTS_CLI_LINK') | default('/usr/local/bin/ocpp-reports', true) }}"
  pre_tasks:
    - name: Validate selected installation role
      ansible.builtin.assert:
        that:
          - reports_role is defined
          - reports_role in ['terminal', 'satellite', 'watchtower', 'control']
    - name: Check persisted installation role
      ansible.builtin.stat:
        path: "{{ reports_root }}/role"
      register: reports_role_file
    - name: Read persisted role
      ansible.builtin.slurp:
        src: "{{ reports_root }}/role"
      register: reports_role_saved
      when: reports_role_file.stat.exists and reports_role_file.stat.isreg
    - name: Refuse changed or invalid role
      ansible.builtin.assert:
        that:
          - not reports_role_file.stat.exists or reports_role_file.stat.isreg
          - not reports_role_file.stat.exists or (reports_role_saved.content | b64decode | trim) == reports_role
    - name: Inspect existing Reports CLI
      ansible.builtin.stat:
        path: "{{ reports_cli_link }}"
        follow: false
      register: reports_previous_cli
    - name: Inspect previous installation without role marker
      ansible.builtin.stat:
        path: "{{ reports_root }}/releases"
      register: reports_previous_releases
    - name: Refuse adoption of an unmarked existing installation
      ansible.builtin.assert:
        that:
          - >-
            reports_role_file.stat.exists or
            (not reports_previous_releases.stat.exists and not reports_previous_cli.stat.exists) or
            (
              (reports_previous_releases.stat.isdir | default(false)) and
              not (reports_previous_releases.stat.islnk | default(false)) and
              ((reports_previous_cli.stat.islnk | default(false)) or not reports_previous_cli.stat.exists)
            )
        fail_msg: "Unrecognized Reports installation without a role marker; refusing deployment."
  tasks:
    - name: Prepare shared Reports installation
      ansible.builtin.import_tasks: tasks/install.yml
    - name: Validate deployment host
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] in ['aarch64', 'x86_64']
    - name: Prepare immutable Reports release
      ansible.builtin.import_tasks: tasks/release.yml
    - name: Activate validated Reports release
      ansible.builtin.import_tasks: tasks/activation.yml
    - name: Apply selected Reports role
      ansible.builtin.include_role:
        name: "{{ reports_role }}"
    - name: Persist immutable Reports role after successful installation
      ansible.builtin.copy:
        dest: "{{ reports_root }}/role"
        content: "{{ reports_role }}"
        owner: root
        group: root
        mode: '0644'
        force: false
      become: true
