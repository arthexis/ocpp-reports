name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test-${{ matrix.python }}
    needs: static_validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Install pinned CSMS producer for cross-repository contract test
        run: python -m pip install 'git+https://github.com/arthexis/ocpp-csms.git@9ae44f2fed6082dbf30848a48d616a2c07bcfd80'
      - name: Unit and contract tests with timings
        run: python -m pytest
      - name: Dashboard capture helper unit tests (offline)
        run: python -m unittest discover -s tools/customer-dashboard-capture/scripts -p test_shots.py -v
      - name: CLI smoke
        run: |
          ocpp-reports --help
          ocpp-reports status --json
          ocpp-reports check --since 2026-10-01T00:00:00+00:00 --until 2026-10-02T00:00:00+00:00 --json
      - name: Wheel build and install smoke
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          ocpp-reports status --json
          python -c "from importlib.resources import files; assert files('ocpp_reports').joinpath('templates/summary.html.j2').read_text().startswith('<!doctype html>')"
          python -m pip check

  static_validation:
    name: Deployment static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install preflight dependencies
        run: python3 -m pip install '.[test]' ansible-core ansible-lint
      - name: Fast preflight (rendered artifacts, shell, Ansible)
        run: bash scripts/preflight.sh --quick

  browser_offline:
    name: Offline Chromium UI (synthetic fixtures)
    needs: static_validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install '.[test]' 'playwright>=1.53,<2'
      - name: Install Chromium exclusively on temporary CI runner
        run: python -m playwright install --with-deps chromium
      - name: Browser acceptance against intercepted synthetic HTTP only
        env:
          OCPP_BROWSER_ARTIFACT_DIR: browser-evidence
        run: python -m pytest tests/test_active_session_browser.py -v
      - name: Retain synthetic screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-209-offline-chromium
          path: browser-evidence/*.png
          if-no-files-found: warn
          retention-days: 7

  systemd_integration:
    name: systemd lifecycle integration
    needs: static_validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Isolated real-systemd local ingest lifecycle
        run: sudo python3 scripts/test_local_ingest_systemd.py

  ansible_integration:
    name: Ansible deployment integration
    needs: static_validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [terminal, satellite, watchtower, control]
    steps:
      - uses: actions/checkout@v5
      - name: Verify deploy.sh executable Git mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(git ls-files --stage -- deploy.sh | awk '{print $1}')"
          test "$mode" = 100755 || { echo "::error::deploy.sh Git mode must be 100755 (got ${mode:-missing})"; exit 1; }
          test -x deploy.sh || { echo '::error::deploy.sh is not executable'; exit 1; }
      - name: Install Ansible
        run: python3 -m pip install ansible-core
      - name: Run isolated role deployment integration
        run: bash scripts/ci_deploy_integration.sh ${{ matrix.role }}

  general:
    name: CI
    if: always()
    needs: [test, static_validation, systemd_integration, ansible_integration, browser_offline]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test matrix jobs
        env:
          RESULT: ${{ needs.test.result }}
          STATIC_RESULT: ${{ needs.static_validation.result }}
          ANSIBLE_RESULT: ${{ needs.ansible_integration.result }}
          SYSTEMD_RESULT: ${{ needs.systemd_integration.result }}
          BROWSER_RESULT: ${{ needs.browser_offline.result }}
        run: |
          test "$RESULT" = success
          test "$STATIC_RESULT" = success
          test "$ANSIBLE_RESULT" = success
          test "$SYSTEMD_RESULT" = success
          test "$BROWSER_RESULT" = success
