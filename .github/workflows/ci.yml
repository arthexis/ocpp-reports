name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Install CSMS producer for cross-repository contract test
        run: python -m pip install 'git+https://github.com/arthexis/ocpp-csms.git@main'
      - name: Unit and contract tests with timings
        run: python -m pytest -ra --durations=10
      - name: CLI smoke
        run: |
          ocpp-reports --help
          ocpp-reports status --json
          ocpp-reports check --since 2026-10-01T00:00:00+00:00 --until 2026-10-02T00:00:00+00:00 --json
      - name: Wheel build and install smoke
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          ocpp-reports status --json
          python -c "from importlib.resources import files; assert files('ocpp_reports').joinpath('templates/summary.html.j2').read_text().startswith('<!doctype html>')"
          python -m pip check

  ansible_integration:
    name: Ansible deployment integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Ansible
        run: python3 -m pip install ansible-core
      - name: Run real deploy.sh into isolated CI directory
        shell: bash
        run: |
          set -euo pipefail
          export OCPP_REPORTS_INSTALL_ROOT="${RUNNER_TEMP}/ocpp-reports"
          export OCPP_REPORTS_CLI_LINK="${RUNNER_TEMP}/ocpp-reports-cli"
          bash deploy.sh
          test -x "$OCPP_REPORTS_CLI_LINK"
          "$OCPP_REPORTS_CLI_LINK" status --json
          test -x "$OCPP_REPORTS_INSTALL_ROOT/releases/$(git rev-parse HEAD)/venv/bin/ocpp-reports"
          bash deploy.sh
          "$OCPP_REPORTS_CLI_LINK" status --json

  general:
    name: general
    if: always()
    needs: [test, ansible_integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test matrix jobs
        env:
          RESULT: ${{ needs.test.result }}
          ANSIBLE_RESULT: ${{ needs.ansible_integration.result }}
        run: |
          test "$RESULT" = success
          test "$ANSIBLE_RESULT" = success
