name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Install CSMS producer for cross-repository contract test
        run: python -m pip install 'git+https://github.com/arthexis/ocpp-csms.git@main'
      - name: Unit and contract tests with timings
        run: python -m pytest -ra --durations=10
      - name: CLI smoke
        run: |
          ocpp-reports --help
          ocpp-reports status --json
          ocpp-reports check --since 2026-10-01T00:00:00+00:00 --until 2026-10-02T00:00:00+00:00 --json
      - name: Wheel build and install smoke
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          ocpp-reports status --json
          python -c "from importlib.resources import files; assert files('ocpp_reports').joinpath('templates/summary.html.j2').read_text().startswith('<!doctype html>')"
          python -m pip check

  static_validation:
    name: Deployment static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n deploy.sh
      - name: Install Ansible validation tools
        run: python3 -m pip install ansible-core ansible-lint
      - name: Ansible playbook syntax
        run: |
          ansible-playbook -i localhost, ansible/playbook.yml --syntax-check
          ansible-playbook -i localhost, ansible/dashboard-instances.yml --syntax-check
      - name: Ansible basic lint
        run: ansible-lint --profile basic ansible/playbook.yml ansible/dashboard-instances.yml
      - name: Compile Python sources
        run: python3 -m compileall -q src

  ansible_integration:
    name: Ansible deployment integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [terminal, satellite, watchtower, control]
    steps:
      - uses: actions/checkout@v5
      - name: Verify deploy.sh executable Git mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(git ls-files --stage -- deploy.sh | awk '{print $1}')"
          test "$mode" = 100755 || { echo "::error::deploy.sh Git mode must be 100755 (got ${mode:-missing})"; exit 1; }
          test -x deploy.sh || { echo '::error::deploy.sh is not executable'; exit 1; }
      - name: Install Ansible
        run: python3 -m pip install ansible-core
      - name: Run real deploy.sh into isolated CI directory
        shell: bash
        run: |
          set -euo pipefail
          # Isolated runners cannot request public ACME certificates or provision credentials.
          # Exercise the explicit HTTPS opt-out while keeping production default enabled.
          export OCPP_REPORTS_NGINX_ENABLED=false
          export OCPP_REPORTS_INSTALL_ROOT="/opt/ocpp-reports-ci"
          export OCPP_REPORTS_CLI_LINK="/usr/local/bin/ocpp-reports-ci"
          ./deploy.sh --${{ matrix.role }}
          test -f "$OCPP_REPORTS_INSTALL_ROOT/role"
          test "$(cat "$OCPP_REPORTS_INSTALL_ROOT/role")" = "${{ matrix.role }}"
          test -x "$OCPP_REPORTS_CLI_LINK"
          test -L "$OCPP_REPORTS_INSTALL_ROOT/current"
          test "$(readlink "$OCPP_REPORTS_CLI_LINK")" = "$OCPP_REPORTS_INSTALL_ROOT/current/venv/bin/ocpp-reports"
          test "$(readlink "$OCPP_REPORTS_INSTALL_ROOT/current")" = "$OCPP_REPORTS_INSTALL_ROOT/releases/$(git rev-parse HEAD)-pkg"
          sudo -u ocpp-reports "$OCPP_REPORTS_CLI_LINK" status --json
          test -x "$OCPP_REPORTS_INSTALL_ROOT/releases/$(git rev-parse HEAD)-pkg/venv/bin/ocpp-reports"
          bash deploy.sh
          # Explicit role must always re-enter Ansible, even for an installed SHA.
          ./deploy.sh --${{ matrix.role }} > /tmp/ocpp-reports-explicit-redeploy.log
          ! grep -q 'skipped Ansible' /tmp/ocpp-reports-explicit-redeploy.log
          grep -q 'PLAY RECAP' /tmp/ocpp-reports-explicit-redeploy.log
          test -L "$OCPP_REPORTS_INSTALL_ROOT/current"
          test ! -e "$OCPP_REPORTS_INSTALL_ROOT/previous"
          if [ "${{ matrix.role }}" = watchtower ] || [ "${{ matrix.role }}" = control ]; then
            sudo -u ocpp-reports "$OCPP_REPORTS_CLI_LINK" status --json
          else
            sudo -u ocpp-reports "$OCPP_REPORTS_CLI_LINK" status --json
          fi
          test "$(cat "$OCPP_REPORTS_INSTALL_ROOT/role")" = "${{ matrix.role }}"
          case "${{ matrix.role }}" in
            terminal) ;;
            satellite)
              test -f /etc/systemd/system/ocpp-reports-forwarder.service
              ! systemctl is-active --quiet ocpp-reports-forwarder.service
              ;;
            watchtower)
              test -f /etc/systemd/system/ocpp-reports-collector.service
              test -f /etc/systemd/system/ocpp-reports-dashboard.service
              ! systemctl is-active --quiet ocpp-reports-collector.service
              systemctl is-active --quiet ocpp-reports-dashboard.service
              ;;
            control)
              test -f /etc/systemd/system/ocpp-reports-forwarder.service
              test -f /etc/systemd/system/ocpp-reports-collector.service
              test -f /etc/systemd/system/ocpp-reports-dashboard.service
              ! systemctl is-active --quiet ocpp-reports-forwarder.service
              ! systemctl is-active --quiet ocpp-reports-collector.service
              systemctl is-active --quiet ocpp-reports-dashboard.service
              ;;
          esac

  general:
    name: CI
    if: always()
    needs: [test, static_validation, ansible_integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test matrix jobs
        env:
          RESULT: ${{ needs.test.result }}
          STATIC_RESULT: ${{ needs.static_validation.result }}
          ANSIBLE_RESULT: ${{ needs.ansible_integration.result }}
        run: |
          test "$RESULT" = success
          test "$STATIC_RESULT" = success
          test "$ANSIBLE_RESULT" = success
